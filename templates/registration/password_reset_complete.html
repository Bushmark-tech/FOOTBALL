{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed | Leon Games Pro</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(22, 27, 34, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-teal: #00f2ea;
            --neon-blue: #4facfe;
            --dark-bg: #0d1117;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --gradient-primary: linear-gradient(135deg, #00f2ea 0%, #4facfe 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 242, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            text-align: center;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-teal), transparent);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(0, 242, 234, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid rgba(0, 242, 234, 0.3);
        }

        .icon-circle i {
            font-size: 2rem;
            color: var(--neon-teal);
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-submit {
            display: inline-block;
            width: 100%;
            background: var(--gradient-primary);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #000;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 234, 0.4);
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="icon-circle">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="auth-title">Password Changed!</h1>
            <p class="auth-subtitle">
                Your password has been set. You may go ahead and log in now.
            </p>

            <a href="/login/" class="btn-submit">Sign In</a>
        </div>
    </div>

</body>

</html>
