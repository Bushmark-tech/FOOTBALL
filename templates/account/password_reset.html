{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Leon Games Pro</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(22, 27, 34, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-teal: #00f2ea;
            --neon-blue: #4facfe;
            --dark-bg: #0d1117;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --input-bg: rgba(13, 17, 23, 0.6);
            --gradient-primary: linear-gradient(135deg, #00f2ea 0%, #4facfe 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 242, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-teal), transparent);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .app-logo {
            font-size: 2.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            display: inline-block;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 45px 12px 45px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--neon-teal);
            box-shadow: 0 0 0 3px rgba(0, 242, 234, 0.1);
            background: rgba(13, 17, 23, 0.8);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1rem;
            transition: color 0.3s;
        }

        .form-control:focus+.input-icon {
            color: var(--neon-teal);
        }

        .btn-submit {
            width: 100%;
            background: var(--gradient-primary);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #000;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 234, 0.4);
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .footer-link a {
            color: var(--neon-teal);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .auth-container {
                padding: 15px;
                max-width: 100%;
            }

            .auth-card {
                padding: 30px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="app-logo">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="auth-title">Password Reset</h1>
                <p class="auth-subtitle">
                    Forgotten your password? Enter your email address below, and we'll send you an email allowing you to
                    reset it.
                </p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="Enter your email address"
                        required autofocus>
                    <i class="fas fa-envelope input-icon"></i>
                </div>

                <button type="submit" class="btn-submit">
                    Send Reset Link
                </button>
            </form>

            <div class="footer-link">
                Remember your password? <a href="/login/">Sign In</a>
            </div>

            <div class="footer-link" style="margin-top: 10px; font-size: 0.8rem;">
                Please contact us if you have any trouble resetting your password.
            </div>
        </div>
    </div>

</body>

</html>
